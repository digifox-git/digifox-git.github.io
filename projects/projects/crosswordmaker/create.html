<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon_glass.ico">
    <link href="style.css" rel="stylesheet" type="text/css">
    <script src="main.js"></script>
    <title>Puzzle Architect: Crossword</title>
</head>
<body>
    <div id="content">
        <div id="workspace">
            <div id="crossword-settings">
                <p>Crossword Settings</p>
                <input id="title" type="text" value="My Crossword Title" placeholder="Enter Title"></input>
            </div>
            <table id="maker"></table>
            <div id="properties">
                <div id="properties-content">
                    <p>Cell Properties</p>
                    <div class="option" id="option-hint-left">
                        <p>Left Identifier</p>
                        <input id="cell-identifier-left" type="text" minLength="0" maxLength="3">
                        <div id="cell-hint-left" style="display: none;">
                            <p>Direction</p>
                            <input type="text" id="hint-direction-left" placeholder="Across, Left, etc...">
                            <p>Hint</p>
                            <input type="text" id="hint-left">
                        </div>
                    </div>
                    <div class="option" id="option-hint-right">
                        <p>Right Identifier</p>
                        <input id="cell-identifier-right" type="text" minLength="0" maxLength="3">
                        <div id="cell-hint-right" style="display: none;">
                            <p>Direction</p>
                            <input type="text" id="hint-direction-right" placeholder="Across, Left, etc...">
                            <p>Hint</p>
                            <input type="text" id="hint-right">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
